[project]
name = "kaggriculture"
version = "1.0.0"
description = "Digital-twin farm simulation with Greedy and MCTS agents (Kaggriculture)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["kaggriculture"]
