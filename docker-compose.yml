services:
  kaggriculture-mcts-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaggriculture-mcts-agent:latest
    container_name: kaggriculture-mcts-agent
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
